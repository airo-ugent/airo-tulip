[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "airo-tulip-hal"
version = "0.5.0"
authors = [
  { name = "Mathieu De Coster", email = "mathieu.decoster@ugent.be" },
  { name = "Thomas Van Acker", email = "thovacke.vanacker@ugent.be" }
]
description = "Hardware abstraction layer and server for the KELO Robile platform, based on KELO tulip. Runs on the KELO CPU brick."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

dependencies = [
  "airo-tulip==0.5.0",
  "loguru>=0.7.2",
  "pysoem>=1.1.6",
  "numpy",
  "eclipse-zenoh>=1.0.0",
  "airo-typing>=2025.4.0"
]

[project.urls]
Homepage = "https://github.com/airo-ugent/airo-tulip"
Issues = "https://github.com/airo-ugent/airo-tulip/issues"

# Package discovery is handled by setup.py (find_namespace_packages), matching the airo-tulip package.
