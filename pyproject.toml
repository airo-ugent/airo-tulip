[project]
name = "airo-tulip-main"
version = "0.1.0"
description = "Workspace for the airo-tulip client and the airo-tulip-hal hardware abstraction layer."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "airo-tulip",
    "airo-tulip-hal",
    "airo-typing>=2025.4.0",
]

[tool.uv.sources]
airo-tulip = { path = "airo-tulip" }
airo-tulip-hal = { path = "airo-tulip-hal" }
